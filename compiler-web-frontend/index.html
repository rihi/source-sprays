<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Source Spray VTF Converter</title>
  <link data-trunk rel="css" href="styles.css" />
  <link data-trunk rel="rust" href="../crates/compiler-wasm/Cargo.toml" data-initializer="initializer.js" />
</head>
<body class="wasm-loading">
  <div id="wasmOverlay" class="wasm-overlay" role="alert" aria-live="assertive">
    <div class="wasm-overlay-panel">
      <h2 id="wasmOverlayTitle">Loading compiler</h2>
      <p id="wasmOverlayMessage">Loading the WebAssembly package.</p>
    </div>
  </div>

  <aside class="sidebar">
    <header class="title-block">
      <h1>VTF Converter</h1>
      <p>Build Source Engine spray VTFs from image frames and mip overrides.</p>
    </header>

    <form id="settings" class="settings">
      <label class="field">
        <span>File size limit</span>
        <div class="inline-input">
          <input id="sizeLimit" type="number" min="1" step="1" value="512">
          <span>KiB</span>
        </div>
      </label>

      <label class="field">
        <span>Desired max resolution</span>
        <input id="desiredResolution" type="number" min="4" step="4" value="1024">
      </label>

      <label class="field">
        <span>Frames</span>
        <input id="frameCount" type="number" min="1" step="1" value="1">
      </label>

      <label class="field">
        <span>Mips</span>
        <div class="toggle-row">
          <input id="lowestMipEnabled" type="checkbox">
          <span>Generate Mip-Maps</span>
        </div>
      </label>

      <fieldset class="radio-group">
        <legend>Texture format</legend>
        <label>
          <input type="radio" name="textureFormat" value="dxt1" checked>
          <span>DXT1</span>
        </label>
        <label>
          <input type="radio" name="textureFormat" value="dxt5">
          <span>DXT5</span>
        </label>
      </fieldset>
    </form>

    <section class="result-panel">
      <div class="result-row">
        <span>Picked resolution</span>
        <strong id="pickedResolution">-</strong>
      </div>
      <div class="result-row">
        <span>File size</span>
        <strong id="fileSize">-</strong>
      </div>
      <p id="statusText" class="status-text">Waiting for wasm package.</p>
    </section>

    <button id="exportButton" class="export-button" type="button" disabled title="Wasm package is not loaded.">
      Export VTF
    </button>

    <footer class="sidebar-footer">
      <hr class="footer-divider">
      <p>Created by <strong>Rihi</strong></p>
      <a href="https://github.com/rihi/source-sprays" target="_blank" class="github-link">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
        View on GitHub
      </a>
    </footer>
  </aside>

  <main class="workspace">
    <div id="gridWrap" class="grid-wrap">
      <div id="imageGrid" class="image-grid"></div>
    </div>
  </main>

  <input id="fileInput" type="file" accept="image/*" hidden>
  <script data-trunk type="module" src="main.js"></script>
</body>
</html>
