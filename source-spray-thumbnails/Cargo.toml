[package]
name = "vtf_thumbnails"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
image = { version = "0.25.10", default-features = false }
texture2ddecoder = "0.1.2"
thiserror = "2.0.18"
windows-core = "0.62.2"
winreg = { version = "0.56", features = ["transactions"] }

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemServices"
]

